name: Validate app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: artifacts/api-server/src/field-atlas/services/optimizer/requirements.lock.txt
      - name: Install optimizer with inherited user-site pip settings
        env:
          PIP_USER: 'true'
          PIP_CONFIG_FILE: ${{ runner.temp }}/atlas-pip-user.conf
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['PIP_CONFIG_FILE']).write_text('[install]\nuser = true\n')
          PY
          pnpm run setup:optimizer
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:api
      - run: pnpm run test:runtime
      - run: pnpm --filter @workspace/field-sales-atlas exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
